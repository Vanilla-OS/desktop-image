name: Vib Build

on:
  push:
    branches:
      - 'dev'
      - 'vision'
    tags:
      - '*'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: vanilla-os/build-gh-action@main
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome
          base-image: ghcr.io/vanilla-os/core

  merge:
    name: Merge
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: vanilla-os/merge-gh-action@main
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome
          legacy-image: ghcr.io/${{ github.repository_owner }}/desktop:main
  
  differ:
    name: Differ
    needs: merge
    if: github.repository == 'vanilla-os/desktop-image' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/vanilla-os/gnome:latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: vanilla-os/differ-gh-action@main
        with:
          image: gnome
          legacy_image: desktop
          differ_url: ${{ vars.DIFFER_URL }}
          differ_user: ${{ secrets.DIFFER_USER }}
          differ_psw: ${{ secrets.DIFFER_PSW }}