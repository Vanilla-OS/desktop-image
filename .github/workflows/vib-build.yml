name: Vib Build

on:
  push:
    branches:
      - 'dev'
      - 'vision'
    tags:
      - '*'
  workflow_dispatch:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: vanilla-os/build-action@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome
          base-image: ghcr.io/vanilla-os/core

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Generate image name
        run: |
          REPO_OWNER_LOWERCASE="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          echo "REPO_OWNER_LOWERCASE=$REPO_OWNER_LOWERCASE" >> "$GITHUB_ENV"
          echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/gnome" >> "$GITHUB_ENV"
      - uses: vanilla-os/merge-action@v1
        with:
          image: ${{ env.IMAGE_URL }}
          legacy-image: ${{ github.repository == 'vanilla-os/desktop-image' && format('ghcr.io/{0}/desktop:main', env.REPO_OWNER_LOWERCASE) || '' }}
