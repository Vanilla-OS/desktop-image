name: printers
type: apt
sources:
  - packages:
    # General
    - cups
    - cups-pk-helper
    - bluez-cups

    - printer-driver-brlaser  # Brother
    - printer-driver-escpr    # Epson
    - hplip                   # HP

    # Config
    - system-config-printer-common
    - system-config-printer-udev
cleanup:
  - /etc/ssl/certs/ssl-cert-snakeoil.pem
  - /etc/ssl/private/ssl-cert-snakeoil.key
