name: vso
type: shell
sources:
  - type: tar
    url: https://github.com/Vanilla-OS/vanilla-system-operator/releases/download/v3.0.0/vso-amd64.tar.gz
    checksum: 1cbb94bba609915e4c9ebda0cafdd7ca2e3244ff4fc028c6532e77afe7486428
    only-arches: [amd64]
  - type: tar
    url: https://github.com/Vanilla-OS/vanilla-system-operator/releases/download/v3.0.0/vso-arm64.tar.gz
    checksum: 06304270f168d06fa573200b5d7d93cd911de7d885955d533b808459b6552c34
    only-arches: [arm64]
commands:
- mkdir -p /usr/bin
- cp /sources/vso/vso*/vso /usr/bin/vso
- chmod +x /usr/bin/vso
modules:
- name: vso-manpage
  type: shell
  sources:
    - type: tar
      url: https://github.com/Vanilla-OS/vanilla-system-operator/releases/download/v3.0.0/vso-man.tar.gz
      checksum: eb2b95bd4bd904286c7e37d3f7cb42ab0694ce8073993d7057c7102a9aa2d4c2
  commands:
  - mv /sources/vso-manpage/vso-man/man/man1/vso.1 /usr/share/man/man1/

- name: vso-extra-setup
  type: shell
  commands:
  - chmod +x /usr/bin/setup-vso-terminal
  - chmod +x /usr/bin/reset-vso
  - chmod +x /usr/share/vso/scripts/*

- name: vso-gnome-ext
  type: shell
  sources:
    - type: tar
      url: https://github.com/Vanilla-OS/vso-gnome-ext/archive/refs/tags/1.5.tar.gz
  commands:
  - mkdir -p /usr/share/gnome-shell/extensions/
  - mv /sources/vso-gnome-ext/1.5/vso-gnome-ext-1.5/vso\@vanillaos.org /usr/share/gnome-shell/extensions/vso\@vanillaos.org

- name: vso-deps-install
  type: apt
  sources:
    - packages:
      - dpkg-dev
      - ifstat

- name: adwdialog
  type: dpkg-buildpackage
  source:
    type: git
    url: https://github.com/Vanilla-OS/AdwDialog.git
    tag: v0.2.1
    paths:
      - adwdialog
  modules:
  - name: adwdialog-deps-install
    type: apt
    sources:
      - packages:
        - build-essential
        - debhelper
        - desktop-file-utils
        - dpkg-dev
        - gettext
        - libadwaita-1-dev
        - libjpeg-dev
        - make
        - meson
        - python3

- name: enable-systemd-unit
  type: shell
  commands:
  - ln -s /usr/lib/systemd/system/vanilla-updates.service /etc/systemd/system/multi-user.target.wants/vanilla-updates.service
  - ln -s /usr/lib/systemd/system/vanilla-updates.timer /etc/systemd/system/timers.target.wants/vanilla-updates.timer
  - mkdir -p /usr/lib/systemd/user/default.target.wants
  - ln -s /usr/lib/systemd/user/vso-pre-run.service /usr/lib/systemd/user/default.target.wants/vso-pre-run.service
  - ln -s /usr/lib/systemd/user/vso-resolv.service /usr/lib/systemd/user/default.target.wants/vso-resolv.service
  - ln -s /usr/lib/systemd/user/vso-tasks-rotation.service /usr/lib/systemd/user/default.target.wants/vso-tasks-rotation.service
