name: vso
type: shell
sources:
  - type: tar
    url: https://github.com/Vanilla-OS/vanilla-system-operator/releases/download/v2.0.7/vso-amd64.tar.gz
    checksum: 248a2fc5031cbb2febdcbf0069ef1924978957b411160b37870bfdb8e66b19ff
    only-arches: [amd64]
  - type: tar
    url: https://github.com/Vanilla-OS/vanilla-system-operator/releases/download/v2.0.7/vso-arm64.tar.gz
    checksum: ef92168697b6c683d2200867b92298c441b75f48b9ad3ad7fb57110d1862e26f
    only-arches: [arm64]
commands:
- mkdir -p /usr/bin
- cp /sources/vso/vso*/vso /usr/bin/vso
- chmod +x /usr/bin/vso
modules:
- name: vso-manpage
  type: shell
  sources:
    - type: tar
      url: https://github.com/Vanilla-OS/vanilla-system-operator/releases/download/v2.0.7/vso-man.tar.gz
      checksum: 5ea2f081508e759a45271c0257123421ec11d77ec3ed3634b897fdc1bc1bd439
  commands:
  - mv /sources/vso-manpage/vso-man/man/vso.1 /usr/share/man/man1/

- name: vso-extra-setup
  type: shell
  commands:
  - chmod +x /usr/bin/setup-vso-terminal
  - chmod +x /usr/bin/reset-vso

- name: vso-gnome-ext
  type: shell
  sources:
    - type: tar
      url: https://github.com/Vanilla-OS/vso-gnome-ext/archive/refs/tags/1.5.tar.gz
  commands:
  - mkdir -p /usr/share/gnome-shell/extensions/
  - mv /sources/vso-gnome-ext/1.5/vso-gnome-ext-1.5/vso\@vanillaos.org /usr/share/gnome-shell/extensions/vso\@vanillaos.org

- name: vso-deps-install
  type: apt
  sources:
    - packages:
      - dpkg-dev
      - ifstat

- name: adwdialog
  type: dpkg-buildpackage
  source:
    type: git
    url: https://github.com/Vanilla-OS/AdwDialog.git
    tag: v0.2.0
    paths:
      - adwdialog
  modules:
  - name: adwdialog-deps-install
    type: apt
    sources:
      - packages:
        - build-essential
        - debhelper
        - desktop-file-utils
        - dpkg-dev
        - gettext
        - libadwaita-1-dev
        - libjpeg-dev
        - make
        - meson
        - python3

- name: enable-systemd-unit
  type: shell
  commands:
  - ln -s /usr/lib/systemd/system/vanilla-updates.service /etc/systemd/system/multi-user.target.wants/vanilla-updates.service
  - ln -s /usr/lib/systemd/system/vanilla-updates.timer /etc/systemd/system/timers.target.wants/vanilla-updates.timer
  - mkdir -p /usr/lib/systemd/user/default.target.wants
  - ln -s /usr/lib/systemd/user/vso-pre-run.service /usr/lib/systemd/user/default.target.wants/vso-pre-run.service
  - ln -s /usr/lib/systemd/user/vso-migrate-repo.service /usr/lib/systemd/user/default.target.wants/vso-migrate-repo.service
  - ln -s /usr/lib/systemd/user/vso-resolv.service /usr/lib/systemd/user/default.target.wants/vso-resolv.service
  - ln -s /usr/lib/systemd/user/vso-tasks-rotation.service /usr/lib/systemd/user/default.target.wants/vso-tasks-rotation.service
